[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai-nvidia"
version = "0.1.0"
description = "Source-grounded Nemotron extraction with a review queue and Zetaris storage."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pillow",
    "pypdfium2",
    "pydantic",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
